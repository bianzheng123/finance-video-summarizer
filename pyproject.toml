[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-video-summarizer"
version = "0.1.0"
description = "Turn Chinese financial videos into structured, citation-backed research reports via ASR transcription and multi-stage LLM analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "bilibili-api-python>=17.4.1",
    "beautifulsoup4>=4.14.0",
    "cssutils>=2.0.0",
    "python-dotenv>=1.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.0.0",
    "langchain-core>=0.3.33,<0.4.0",
    "langchain-openai>=0.3.11",
    "markdown-it-py>=4.0.0",
    "pillow>=12.0.0",
    "pilmoji>=2.0.5",
    "premailer>=3.10.0",
    "pydantic>=2.12.0",
    "pypinyin>=0.51.0",
    "cos-python-sdk-v5",
    "requests>=2.33.0",
    "streamget>=4.0.9",
    "tenacity>=8.0.0",
    "tencentcloud-sdk-python",
    "tqdm>=4.67.0",
    "yt-dlp>=2026.3.0",
]

[project.optional-dependencies]
# A 股实时行情（缺失时相关阶段自动降级）
market = ["akshare>=1.18.0"]
# token 精确计数（缺失时退化为启发式估算）
tokenize = ["transformers>=4.0.0"]
# PDF 导出（Windows 依赖 GTK3 运行时，可选；不装则无 summary.pdf，其余产物不受影响）
pdf = ["weasyprint>=68.0"]

[tool.setuptools]
packages = ["video_summarize"]

[dependency-groups]
dev = ["pytest>=9.0.0"]
