[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-video-summarizer"
version = "0.1.0"
description = "Turn Chinese financial videos into structured, citation-backed research reports via ASR transcription and multi-stage LLM analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "bilibili-api-python>=17.4.1",
    "python-dotenv>=1.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.0.0",
    "langchain-core>=0.3.33,<0.4.0",
    "langchain-openai>=0.3.11",
    "markdown-it-py>=4.0.0",
    "pydantic>=2.12.0",
    "pypinyin>=0.51.0",
    "cos-python-sdk-v5",
    "requests>=2.33.0",
    "tenacity>=8.0.0",
    "tencentcloud-sdk-python",
    "tqdm>=4.67.0",
    "yt-dlp>=2026.3.0",
    # 桌面 GUI / PDF / 行情 / token 计数 / 打包（默认全部安装，uv sync 一把装齐）
    "PySide6>=6.7.0",
    "weasyprint>=68.0",
    "akshare>=1.18.0",
    "transformers>=4.0.0",
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.0.0"]
